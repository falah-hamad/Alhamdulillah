
workflows:
  android-debug:
    name: Alhamdulillah Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 22
      java: 21
      groups:
        - firebase_credentials

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Restore Firebase Android configuration
        script: |
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          else
            echo "Warning: Firebase Android configuration is not set."
          fi

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor Android
        script: |
          npx cap sync android

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        script: |
          test -f "$CM_BUILD_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$CM_BUILD_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
