workflows:
  android-debug:
    name: Alhamdulillah Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 22
      java: 21
      groups:
        - firebase_credentials

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Create Firebase Android configuration
        script: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 is not configured."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

          if [ ! -s android/app/google-services.json ]; then
            echo "ERROR: google-services.json was not created."
            exit 1
          fi

          echo "google-services.json created successfully."

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor Android
        script: |
          npx cap sync android

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
