<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      // Keep the layout-width choice on this device only (localStorage is not account-synced).
      (function () {
        var viewport = document.querySelector('meta[name="viewport"]');
        if (!viewport) return;
        var savedWidth = null;
        try {
          var stored = Number(window.localStorage.getItem("alhamdulillah_viewport_width"));
          if (Number.isFinite(stored) && stored >= 500 && stored <= 1000) savedWidth = Math.round(stored);
        } catch (_) {}
        var isNarrowPhone = window.matchMedia && window.matchMedia("(max-width: 600px)").matches;
        var width = savedWidth !== null ? savedWidth : (isNarrowPhone ? 501 : null);
        if (width !== null) {
          viewport.setAttribute("content", "width=" + width + ", viewport-fit=cover, interactive-widget=resizes-content");
        }
      })();
    </script>
    <title>دفتر الديون المحاسبي</title>
    <meta name="description" content="نظام محاسبي متكامل لإدارة سجل الديون، العملاء، البضائع، الدفعات، الفواتير، والتقارير المالية بدقة واحترافية عالية مع دعم كامل للطباعة والبحث والنسخ الاحتياطي." />
