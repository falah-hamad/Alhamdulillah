name: Deploy Firebase Backend

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Firebase backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/817551423064/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions
          service_account: github-firebase-deployer-01@gen-lang-client-0628217852.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Validate Firebase configuration
        run: node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8')); console.log('firebase.json is valid JSON')"

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Build Cloud Functions
        run: npm --prefix functions run build

      - name: Deploy backend services only
        run: >-
          firebase deploy
          --only functions,firestore:rules,firestore:indexes
          --project gen-lang-client-0628217852
          --non-interactive
