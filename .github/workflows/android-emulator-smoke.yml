name: Android emulator smoke test

on:
  push:
    branches:
      - allahisgreat1
    paths:
      - '.github/workflows/android-emulator-smoke.yml'
      - 'android/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Inject Google services config when provided
        if: ${{ env.ANDROID_GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Install app and capture phone portrait screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.falah.allahisgreat1 1
            sleep 25
            adb shell screencap -p /sdcard/alhamdulillah-portrait.png
            adb pull /sdcard/alhamdulillah-portrait.png ./alhamdulillah-portrait.png
            test -s ./alhamdulillah-portrait.png

      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-portrait-screenshot
          path: alhamdulillah-portrait.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload tested debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-tested-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
